<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fa">
<title>Lista de Compras</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20242b;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;padding:12px}.app{max-width:440px;margin:auto;background:white;border:1px solid #e8eaed;border-radius:14px;padding:14px;box-shadow:0 3px 14px #20242b08}header,.item,.bottom,.add{display:flex;align-items:center;gap:8px}header,.bottom{justify-content:space-between}h1{font-size:18px;margin:0}small,.muted{font-size:12px;color:#717783}.add{margin:14px 0 8px}input{min-width:0;border:1px solid #dfe3e8;border-radius:8px;padding:10px;font:inherit;font-size:14px}#product{flex:1;width:1px}#quantity{width:65px}button{cursor:pointer;border:0;border-radius:8px;font:inherit}#add{background:#16835c;color:white;font-size:22px;width:39px;height:39px}ul{list-style:none;margin:0;padding:0}.item{min-height:43px;border-bottom:1px solid #eef0f2;padding:4px 0}.item input{width:18px;height:18px;accent-color:#16835c;cursor:pointer}.name{flex:1;overflow-wrap:anywhere;font-size:14px}.done .name{text-decoration:line-through;color:#999}.qty{font-size:12px;color:#717783;white-space:nowrap}.delete{background:transparent;color:#8b9199;font-size:19px;padding:4px 8px}.bottom{margin-top:12px}.clear{background:transparent;color:#58616c;font-size:12px;padding:5px}.empty{padding:20px 0;text-align:center;color:#8b9199;font-size:13px}@media(max-width:360px){body{padding:6px}.app{padding:10px}}
</style>
</head>
<body>
<main class="app">
<header><h1>🛒 Compras</h1><small id="counter">0/0 comprados</small></header>
<form class="add" id="form"><input id="product" placeholder="Novo produto..." aria-label="Produto" maxlength="100" required autocomplete="off"><input id="quantity" placeholder="Qtd." aria-label="Quantidade" maxlength="20" value="1"><button id="add" aria-label="Adicionar produto" title="Adicionar">+</button></form>
<ul id="list" aria-label="Lista de compras"></ul>
<div class="bottom"><small id="pending">0 por comprar</small><button class="clear" id="clear" type="button">Limpar comprados</button></div>
</main>
<script>
(()=>{'use strict';const key='lista-compras-v1';const $=id=>document.getElementById(id);let items=[];try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))items=saved.filter(x=>x&&typeof x.name==='string').map(x=>({id:String(x.id),name:x.name,qty:String(x.qty??'1'),done:!!x.done}));}catch{}function save(){try{localStorage.setItem(key,JSON.stringify(items));}catch{}}function render(){const list=$('list');list.replaceChildren();for(const item of items){const li=document.createElement('li');li.className='item'+(item.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=item.done;check.setAttribute('aria-label','Marcar '+item.name+' como comprado');check.addEventListener('change',()=>{item.done=check.checked;save();render()});const name=document.createElement('span');name.className='name';name.textContent=item.name;const qty=document.createElement('span');qty.className='qty';qty.textContent=item.qty;const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='×';del.title='Eliminar';del.setAttribute('aria-label','Eliminar '+item.name);del.addEventListener('click',()=>{items=items.filter(x=>x.id!==item.id);save();render()});li.append(check,name,qty,del);list.append(li)}if(!items.length){const empty=document.createElement('li');empty.className='empty';empty.textContent='A lista está vazia';list.append(empty)}const done=items.filter(x=>x.done).length;$('counter').textContent=`${done}/${items.length} comprados`;$('pending').textContent=`${items.length-done} por comprar`;$('clear').disabled=done===0;$('clear').style.opacity=done?1:.4} $('form').addEventListener('submit',e=>{e.preventDefault();const name=$('product').value.trim();if(!name)return;items.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),name,qty:$('quantity').value.trim()||'1',done:false});save();render();$('product').value='';$('quantity').value='1';$('product').focus()});$('clear').addEventListener('click',()=>{items=items.filter(x=>!x.done);save();render()});render()})();
</script>
</body>
</html>
